<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="Head">SUN SON SOLAR</h1>
    <p class="tagline">Panels, inverters, batteries and full-service solar installation</p>

    <div class="form-container">
        <h2>Sign-Up</h2>
    
        <form id="registerForm">

            <div class="user-type-toggle">
                <label><input type="radio" name="accountType" value="customer" checked><span>Customer</span></label>
                <label><input type="radio" name="accountType" value="employee"><span>Employee</span></label>
            </div>

            <div class="input">
                <label for="firstname">First Name</label>
                <input type="text" id="firstname" name="firstname" placeholder="Enter your first name" required>
            </div>

            <div class="input">
                <label for="lastname">Last Name</label>
                <input type="text" id="lastname" name="lastname" placeholder="Enter your last name" required>
            </div>

            <div class="input">
                <label for="middlename">Middle Name</label>
                <input type="text" id="middlename" name="middlename" placeholder="Enter your middle name" required>
            </div>

            <div class="input">
                <label for="birthdate">Birthdate</label>
                <input type="date" name="birthdate" id="birthdate" required>
            </div>

            <div class="input">
                <label for="gender">Gender</label>
                <select name="gender" id="gender" required>
                    <option value="" disabled selected>Select your gender</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                    <option value="Prefer not to say">Prefer not to say</option>
                </select>
            </div>

            <div class="input">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input">
                <label for="number">Phone Number</label>
                <input type="text" name="number" id="number" minlength="11" maxlength="11" placeholder="Enter phone number" required>
            </div>

            <div class="input">
                <label for="address">Address</label>
                <input type="text" name="address" id="address" placeholder="Enter your address" required>
            </div>

            <div class="input" id="departmentField">
                <label for="department">Department</label>
                <select name="department" id="department">
                    <option value="" disabled selected>Select department</option>
                    <option value="Sales">Sales</option>
                    <option value="Field Services">Field Services (Installation, Maintenance, Repair)</option>
                    <option value="Design & Permitting">Design and Permitting</option>
                    <option value="Monitoring">Monitoring</option>
                    <option value="IT">IT</option>
                    <option value="Management">Management</option>
                </select>
            </div>

            <div class="input">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter your username" required>
            </div>

            <div class="input">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Create a password" required minlength="8">
            </div>

            <div class="input">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter your password" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Register</button>
        </form>

        <p class="form-footer">Already have an account? <a href="Login.html">Log in</a></p>
    </div>
</body>
</html>
