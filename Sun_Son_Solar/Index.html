<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="Head">SUN SON SOLAR</h1>
    <div class="form-container">
        <h2>Sign-Up</h2>
        
        <form action="Login.html" method="get">

            <div class="input">
                <label for="firstname">First Name:</label>
                <input type="text" id="firstname" name="firstname" placeholder="Enter your first name" required>
            </div>

            <div class="input">
                <label for="lastname">Last Name:</label>
                <input type="text" id="lastname" name="lastname" placeholder="Enter your last name" required>
            </div>

            <div class="input">
                <label for="middlename">Middle Name:</label>
                <input type="text" id="middlename" name="middlename" placeholder="Enter your middle name" required>
            </div>

            <div class="input">
                <label for="birthdate">Birthdate</label>
                <input type="date" name="birthdate" id="birthdate" placeholder="Enter Your Birth Date" required>
            </div>

            <div class="input">
                <label for="email">Email</label>
                <input type="text" name="email" id="email" placeholder="Enter Your Email" required>
            </div>
    
            <div class="input">
                <label for="number">Phone Number</label>
                <input type="text" name="number" id="number" minlength="11" maxlength="11" placeholder="Enter Phone Number" required>
            </div>

            <div class="input">
                <label for="address">Address</label>
                <input type="text" name="address" id="address" placeholder="Enter Your Address" required>
            </div>

            <div class="input">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter Your Username" required>
            </div>

            <div class="input">
                <label for="password">Password</label>
                <input type="text" id="password" name="password"  placeholder="Create a password" required>
            </div>

     
            <button type="submit" class="submit-btn">Register</button>

        </form>
    </div>

</body>
</html>
