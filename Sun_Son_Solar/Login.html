<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login - Sun Son Solar</title>
</head>
<body>
    <h1 class="Head">SUN SON SOLAR</h1>
    <p class="tagline">Panels, inverters, batteries and full-service solar installation</p>

    <div class="form-container">
        <h2>Log-In</h2>
   
        <form id="loginForm">
            <div class="user-type-toggle">
                <label><input type="radio" name="role" id="role-customer" value="customer" checked><span>Customer</span></label>
                <label><input type="radio" name="role" id="role-employee" value="employee"><span>Employee</span></label>
            </div>

            <div class="input">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter your username" required>
            </div>

            <div class="input">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <div class="input employee-only">
                <label for="demoRole">Demo only: view as</label>
                <select id="demoRole" name="demoRole">
                    <option value="technician">Technician</option>
                    <option value="admin">Admin / Dispatcher</option>
                </select>
            </div>
            <a href="ForgotPassword.html" class="forgot-link">Forgot password?</a>
            <button type="submit" class="submit-btn" id="submitBtn">Login</button>
        </form>

        <p class="form-footer">New customer? <a href="Register.html">Create an account</a></p>
        <p class="form-footer">Employees: your account is created by HR or admin.<br>
            <a href="Index.html">&larr; Back to home</a></p>
    </div>
    <script src="app.js"></script>
</body>
</html>
