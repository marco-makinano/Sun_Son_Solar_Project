<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
    <h1 class="Head">SUN SON SOLAR</h1>
    <p class="tagline">Panels, inverters, batteries and full-service solar installation</p>

    <div class="form-container">
        <h2>Log-In</h2>
   
        <form id="loginForm">
            <div class="input">
                <label for="username">Username</label>
                <input type="text" name="username" id="username" placeholder="Enter your username" required>
            </div>

            <div class="input">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">Login</button>
        </form>

        <p class="form-footer">New here? <a href="Index.html">Create an account</a></p>
    </div>
</body>
</html>
